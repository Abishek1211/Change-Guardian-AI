name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # No LLM_API_KEY is set on purpose. The suites are designed to run with no
    # provider: agent 7 takes its deterministic fallback and nothing leaves the
    # runner. A secret here would make the tests non-hermetic for forks.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: LLM client and circuit breaker
        run: python backend/tests/test_llm_client.py

      - name: Pipeline and scoring
        env:
          # fastembed is what the container ships; pin it so CI exercises the
          # same retrieval path as production rather than a torch fallback.
          EMBEDDING_BACKEND: fastembed
        run: python backend/tests/test_pipeline.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Typecheck and build
        run: npm run build
        working-directory: frontend

  image:
    name: Docker build (arm64)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # The deploy target is an Oracle Ampere instance. Building for arm64 here
      # is the only place that gets verified before Dokploy - a wheel that has
      # no aarch64 build fails this job instead of the deployment.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
