# Local parity with the Dokploy deployment. On the server Dokploy builds from
# the Dockerfile directly and injects environment from its own UI - nothing
# secret belongs in this file.
#
#   cp .env.example .env      # add LLM_API_KEY
#   docker compose up --build

services:
  changeguardian:
    build:
      context: .
      dockerfile: Dockerfile
    image: changeguardian:local
    ports:
      - '8000:8000'
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      # Empty is valid: the pipeline runs fully without a model and agent 7
      # falls back to the deterministic explanation.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-5}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # The box runs other apps. Two of four cores and 1 GB is generous for
          # a pipeline whose heaviest step is a 384-dim embedding of one string.
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 256M
