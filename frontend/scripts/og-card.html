<!doctype html>
<!--
  Source for the 1200x630 social preview, rendered by screenshots.mjs.

  Purpose-built rather than a cropped screenshot: link previews are displayed
  around 500px wide, where real UI text becomes unreadable. Everything here is
  sized to survive that reduction.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --ink-950: #080b11;
        --ink-900: #0d121b;
        --ink-800: #18202f;
        --accent: #34d399;
        --critical: #f87171;
        --mono: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
      }

      body {
        width: 1200px;
        height: 630px;
        background: var(--ink-950);
        color: #cbd5e1;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 62px 68px;
        /* A faint emerald wash behind the score, so the card is not a flat slab. */
        background-image: radial-gradient(
          760px 420px at 82% 46%,
          rgba(52, 211, 153, 0.09),
          transparent 70%
        );
      }

      .top {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .title {
        font-size: 40px;
        font-weight: 650;
        letter-spacing: -0.5px;
        color: #f1f5f9;
      }

      .title span {
        color: var(--accent);
      }

      .middle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 56px;
      }

      .lede {
        font-size: 34px;
        line-height: 1.34;
        color: #e2e8f0;
        max-width: 620px;
        font-weight: 350;
      }

      .lede b {
        color: var(--accent);
        font-weight: 650;
      }

      .card {
        flex-shrink: 0;
        width: 384px;
        border: 1px solid rgba(248, 113, 113, 0.36);
        border-radius: 14px;
        background: var(--ink-900);
        padding: 26px 28px;
      }

      .score-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      .score {
        font-family: var(--mono);
        font-size: 82px;
        font-weight: 700;
        line-height: 1;
        color: var(--critical);
      }

      .of {
        font-family: var(--mono);
        font-size: 26px;
        color: #475569;
      }

      .verdict {
        margin-left: auto;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2.4px;
        color: var(--critical);
      }

      .factors {
        margin-top: 22px;
        border-top: 1px solid var(--ink-800);
        padding-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 11px;
      }

      .factor {
        display: flex;
        align-items: center;
        gap: 13px;
        font-family: var(--mono);
        font-size: 18px;
        color: #94a3b8;
      }

      .pts {
        width: 46px;
        text-align: right;
        color: #64748b;
      }

      .bar {
        height: 7px;
        border-radius: 4px;
        background: var(--critical);
        opacity: 0.7;
      }

      .bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--ink-800);
        padding-top: 26px;
        font-family: var(--mono);
        font-size: 21px;
        color: #64748b;
      }

      .stack span + span::before {
        content: '·';
        margin: 0 11px;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <svg width="52" height="52" viewBox="0 0 32 32" aria-hidden="true">
        <path
          d="M16 5.4 25 8.5v6.9c0 5.4-3.6 9.7-9 11.2-5.4-1.5-9-5.8-9-11.2V8.5L16 5.4Z"
          fill="none"
          stroke="#34d399"
          stroke-width="2.1"
          stroke-linejoin="round"
        />
        <path
          d="m11.9 16.1 2.9 2.9 5.3-6.1"
          fill="none"
          stroke="#34d399"
          stroke-width="2.1"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <div class="title">ChangeGuardian <span>AI</span></div>
    </div>

    <div class="middle">
      <div class="lede">
        Predicts production deployment risk before rollout.<br />
        <b>Six of seven agents are deterministic</b> — no model touches the score.
      </div>

      <div class="card">
        <div class="score-row">
          <div class="score">100</div>
          <div class="of">/100</div>
          <div class="verdict">CRITICAL</div>
        </div>
        <div class="factors">
          <div class="factor">
            <span class="pts">+30</span><span class="bar" style="width: 96px"></span>
            <span>criticality</span>
          </div>
          <div class="factor">
            <span class="pts">+30</span><span class="bar" style="width: 96px"></span>
            <span>4 violations</span>
          </div>
          <div class="factor">
            <span class="pts">+25</span><span class="bar" style="width: 80px"></span>
            <span>5 affected</span>
          </div>
          <div class="factor">
            <span class="pts">+20</span><span class="bar" style="width: 64px"></span>
            <span>P1 incident</span>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="stack">
        <span>LangGraph</span><span>FastAPI</span><span>FAISS</span><span>NetworkX</span><span>React</span>
      </div>
      <div>changeguardian.abishekrajavelu.in</div>
    </div>
  </body>
</html>
